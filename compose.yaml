name: simatis-os

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simatis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?À définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-simatis}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT:-5440}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built here so the host-side DATABASE_URL in .env never leaks into the container.
      DATABASE_URL: postgres://${POSTGRES_USER:-simatis}:${POSTGRES_PASSWORD:?À définir dans .env}@db:5432/${POSTGRES_DB:-simatis}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?À définir dans .env}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRETS_DIR: /app/secrets/instances
      REAL_WRITES: ${REAL_WRITES:-off}
      BACKUP_STATUS_FILE: /app/backup-status/last.json
    volumes:
      - ./secrets:/app/secrets:ro
      - backup-status:/app/backup-status:ro
    ports:
      - '127.0.0.1:${APP_PORT:-4300}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simatis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?À définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-simatis}
      # Local repository by default (same machine: test only). Off-site: an s3:… URL, see .env.example.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?À définir dans .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - backup-status:/status
      - backup-local:/backups
      - ./secrets:/secrets:ro

volumes:
  db-data:
  backup-status:
  backup-local:
